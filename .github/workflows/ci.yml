name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: off-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.13.0
          package-manager-cache: false

      - name: Activate locked Corepack and pnpm
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/corepack" --no-audit --no-fund corepack@0.35.0
          echo "$RUNNER_TEMP/corepack/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/corepack/bin:$PATH"
          corepack enable --install-directory "$RUNNER_TEMP/corepack/bin" pnpm
          corepack install --global pnpm@10.34.1
          test "$(node --version)" = "v22.13.0"
          test "$(corepack --version)" = "0.35.0"
          test "$(pnpm --version)" = "10.34.1"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete local acceptance matrix
        env:
          COREPACK_DEFAULT_TO_LATEST: "0"
          COREPACK_ENABLE_NETWORK: "0"
          NODE_OPTIONS: "--experimental-strip-types"
        run: |
          pnpm build
          pnpm check
          pnpm test
          pnpm test:node22
          pnpm test:offline
          pnpm release:self-check
