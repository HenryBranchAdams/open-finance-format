name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Immutable candidate commit to verify"
        required: true
        default: "2570e38998dd735b83da301a5b6f0e95aca47073"
        type: string

permissions:
  contents: read

concurrency:
  group: off-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FROZEN_CANDIDATE_COMMIT: "2570e38998dd735b83da301a5b6f0e95aca47073"
      FROZEN_CANDIDATE_TREE: "61e15ac00bd7c8d5500b03ca463f9f6521df2e65"
      FROZEN_RELEASE_TREE: "d688aef11d951c86582f4fcd698400c0095d2a02"
    steps:
      - name: Validate manual verification target
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          test "$REQUESTED_REF" = "$FROZEN_CANDIDATE_COMMIT"

      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_ref || github.sha }}

      - name: Verify checkout provenance
        shell: bash
        env:
          EXPECTED_REF: ${{ inputs.candidate_ref || github.sha }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          actual_repository_tree="$(git rev-parse HEAD^{tree})"
          actual_release_tree="$(git rev-parse HEAD:release/v0.1-rc.1)"
          test "$actual_commit" = "$EXPECTED_REF"
          if [ "$EXPECTED_REF" = "$FROZEN_CANDIDATE_COMMIT" ]; then
            test "$actual_repository_tree" = "$FROZEN_CANDIDATE_TREE"
            test "$actual_release_tree" = "$FROZEN_RELEASE_TREE"
          fi
          {
            echo "## Hosted verification provenance"
            echo
            echo "- Requested ref: \`$EXPECTED_REF\`"
            echo "- Verified commit: \`$actual_commit\`"
            echo "- Repository tree: \`$actual_repository_tree\`"
            echo "- Release subtree tree: \`$actual_release_tree\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.13.0
          package-manager-cache: false

      - name: Activate locked Corepack and pnpm
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/corepack" --no-audit --no-fund corepack@0.35.0
          echo "$RUNNER_TEMP/corepack/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/corepack/bin:$PATH"
          corepack enable --install-directory "$RUNNER_TEMP/corepack/bin" pnpm
          corepack install --global pnpm@10.34.1
          test "$(node --version)" = "v22.13.0"
          test "$(corepack --version)" = "0.35.0"
          test "$(pnpm --version)" = "10.34.1"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete local acceptance matrix for current ref
        if: github.event_name != 'workflow_dispatch'
        env:
          COREPACK_DEFAULT_TO_LATEST: "0"
          COREPACK_ENABLE_NETWORK: "0"
          NODE_OPTIONS: "--experimental-strip-types"
        run: pnpm verify

      - name: Run frozen candidate acceptance matrix
        if: github.event_name == 'workflow_dispatch'
        env:
          COREPACK_DEFAULT_TO_LATEST: "0"
          COREPACK_ENABLE_NETWORK: "0"
          NODE_OPTIONS: "--experimental-strip-types"
        run: |
          pnpm build
          pnpm check
          pnpm test
          pnpm test:node22
          pnpm test:offline
          pnpm release:self-check
