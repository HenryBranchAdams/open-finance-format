  fixed_time_freshness_states:
    - current
    - stale
  boundary_fixtures: present
  hand_reviewed_expected_results: present
  documentation_contract_tests: present
  dependency_free_cli_bundle: present
  offline_harness: passing
  release_allowlist: present
  drift_checksums: present
  local_release_validation: passing

external_evidence:
  immutable_public_anchor: pending
  checksum_manifest_digest: pending
  independent_consumer: pending
  independent_producer: pending
  ten_minute_core_authoring: pending
  public_human_review: pending
  external_design_partner: pending

claims:
  promotion_to_v0_1: not_claimed
  independent_interoperability: not_claimed
  automated_promotion_certification: not_provided
  adoption: not_claimed
  financial_correctness: not_claimed
  independent_lineage_review: not_claimed
  exact_spreadsheet_execution: not_claimed

