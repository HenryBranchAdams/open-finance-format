files:
  - path: README.md
    role: repository_entrypoint
  - path: STRATEGY.md
    role: product_strategy
  - path: docs/PROJECT_BRIEF.md
    role: current_product_boundary
  - path: docs/ROADMAP.md
    role: evidence_and_adoption_roadmap
  - path: docs/OPEN_QUESTIONS.md
    role: pending_evidence_and_decision_queue
  - path: docs/AGENT_BRIEF.md
    role: continuation_instructions
  - path: spec/OFF-Core-0.1.md
    role: normative_core_contract
  - path: spec/profiles/public-equity-research-0.1.md
    role: normative_public_equity_contract
  - path: conformance/corpus.json
    role: layered_conformance_corpus

ambiguity_policy: >-
  Any requirement that needs private clarification must be resolved publicly in
  a new immutable release candidate before the clean-room test restarts.

next_task: >-
  Bind the public candidate to an immutable public commit and publish the
  checksum-manifest digest through an authenticated channel, then run the
  unaffiliated consumer, producer, and timed Core-authoring tasks while leaving
  every result pending until its immutable evidence is publicly reviewed.
